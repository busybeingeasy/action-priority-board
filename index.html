<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchasing Intelligence Dashboard - 현대그린푸드</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-top">
            <div>
                <div class="logo">📊 Purchasing Intelligence</div>
                <div class="logo-subtitle">현대그린푸드 공산품구매팀</div>
            </div>
            <div class="header-controls">
                <div class="last-updated">
                    <span class="last-updated-label">마지막 갱신</span>
                    <span id="lastUpdated">업데이트 중...</span>
                </div>
                <button class="btn-settings" id="settingsBtn">⚙️ 키워드 설정</button>
            </div>
        </div>
    </header>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('actionBoard')">📰 Action Priority Board</button>
        <button class="tab-btn" onclick="switchTab('rawMaterials')">📊 Raw Materials & Macro</button>
    </div>

    <!-- Main Content -->
    <div class="container">
        <!-- Tab 1: Action Priority Board -->
        <div id="actionBoard" class="tab-content active">
            <!-- Action Cards -->
            <div class="section-title">🎯 오늘의 우선 액션</div>
            <div id="actionCardsContainer" class="action-cards">
                <div style="text-align: center; padding: 40px; color: #999;">
                    뉴스를 로드하는 중...
                </div>
            </div>

            <!-- News Feed -->
            <div class="section-title" style="margin-top: 40px;">📰 관련 뉴스 모니터링</div>
            <div class="news-controls">
                <div class="filter-group">
                    <label for="filterType">필터:</label>
                    <select id="filterType">
                        <option value="all">모든 뉴스</option>
                        <option value="협력사">협력사</option>
                        <option value="품목">품목</option>
                        <option value="원료">원료</option>
                        <option value="정책">정책/물류</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterKeyword">키워드:</label>
                    <select id="filterKeyword">
                        <option value="">모든 키워드</option>
                    </select>
                </div>
            </div>
            <div id="newsFeed" class="news-list">
                <div style="text-align: center; padding: 40px; color: #999;">
                    뉴스를 로드하는 중...
                </div>
            </div>
        </div>

        <!-- Tab 2: Raw Materials & Macro -->
        <div id="rawMaterials" class="tab-content">
            <div class="raw-materials-placeholder">
                <h3>📊 원료 가격 및 거시경제 지표</h3>
                <p style="margin-top: 16px;">실시간 API 연동 예정</p>
            </div>
        </div>
    </div>

    <!-- Keyword Settings Modal -->
    <div id="keywordModal">
        <div class="keyword-modal-content">
            <div class="keyword-modal-header">
                <h2>키워드 설정</h2>
                <button class="btn-close" id="closeModalBtn">✕</button>
            </div>
            
            <div class="keyword-modal-body">
                <!-- Suppliers -->
                <div class="keyword-category">
                    <h3>협력사</h3>
                    <div class="keyword-input-group">
                        <input type="text" id="newSupplier" placeholder="협력사 추가...">
                        <button onclick="addKeyword('협력사')">추가</button>
                    </div>
                    <div id="supplierKeywords" class="keyword-list"></div>
                </div>

                <!-- Category -->
                <div class="keyword-category">
                    <h3>품목</h3>
                    <div class="keyword-input-group">
                        <input type="text" id="newCategory" placeholder="품목 추가...">
                        <button onclick="addKeyword('품목')">추가</button>
                    </div>
                    <div id="categoryKeywords" class="keyword-list"></div>
                </div>

                <!-- Raw Material -->
                <div class="keyword-category">
                    <h3>원료</h3>
                    <div class="keyword-input-group">
                        <input type="text" id="newRawMaterial" placeholder="원료 추가...">
                        <button onclick="addKeyword('원료')">추가</button>
                    </div>
                    <div id="rawMaterialKeywords" class="keyword-list"></div>
                </div>

                <!-- Policy -->
                <div class="keyword-category">
                    <h3>정책/물류</h3>
                    <div class="keyword-input-group">
                        <input type="text" id="newPolicy" placeholder="정책/물류 추가...">
                        <button onclick="addKeyword('정책')">추가</button>
                    </div>
                    <div id="policyKeywords" class="keyword-list"></div>
                </div>
            </div>

            <div class="keyword-modal-footer">
                <button class="btn-save" onclick="saveKeywords()">저장</button>
                <button class="btn-reset" onclick="resetToDefault()">기본값 초기화</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
