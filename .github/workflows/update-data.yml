name: Update News Data Daily

on:
  schedule:
    # 매일 오전 9시(한국 시간, UTC+9)에 실행
    - cron: '0 0 * * *'  # UTC 기준 자정 (한국 시간 오전 9시)
  
  # 수동 트리거도 가능
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 pyyaml
      
      - name: Fetch news data
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python scripts/fetch_news.py
      
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/latest.json
          git commit -m "🤖 Update news data - $(date +'%Y-%m-%d %H:%M:%S KST')" || echo "No changes to commit"
          git push
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          cname: apb.moderngreenfood.local

  # 추가 작업: 데이터 품질 검증
  validate-data:
    runs-on: ubuntu-latest
    needs: update-data
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Validate JSON format
        run: |
          python -m json.tool data/latest.json > /dev/null && echo "✅ JSON is valid"
      
      - name: Check data freshness
        run: |
          python scripts/validate_data.py

  # 추가 작업: Slack 알림
  notify-slack:
    runs-on: ubuntu-latest
    needs: [update-data, validate-data]
    if: always()
    
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Action Priority Board - News Update",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "📰 News Data Updated"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Status: ${{ job.status }}\nTime: ${{ github.event.head_commit.timestamp }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Dashboard"
                      },
                      "url": "https://apb.moderngreenfood.local"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
