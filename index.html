<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action Priority Board - 현대그린푸드 구매팀</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- 헤더 -->
        <header class="header">
            <div class="header-content">
                <div class="header-left">
                    <h1 class="logo">📊 Action Priority Board</h1>
                    <p class="subtitle">현대그린푸드 공산품구매팀</p>
                </div>
                <div class="header-right">
                    <div class="last-updated">
                        <span class="update-label">마지막 갱신:</span>
                        <span class="update-time" id="lastUpdated">-</span>
                    </div>
                    <button class="btn-settings" id="settingsBtn">⚙️ 키워드 설정</button>
                </div>
            </div>
        </header>

        <!-- 메인 콘텐츠 -->
        <main class="main-content">
            <!-- 1. 오늘의 액션 카드 -->
            <section class="section">
                <h2 class="section-title">📍 오늘의 우선 액션</h2>
                <div class="action-cards-container" id="actionCardsContainer">
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                </div>
            </section>

            <!-- 2. 뉴스 피드 -->
            <section class="section">
                <div class="section-header">
                    <h2 class="section-title">📰 관련 뉴스 모니터링</h2>
                    <div class="filter-controls">
                        <select id="filterType" class="filter-select">
                            <option value="all">전체</option>
                            <option value="협력사">협력사</option>
                            <option value="품목">품목</option>
                            <option value="원료">원료</option>
                            <option value="정책">정책/물류</option>
                        </select>
                        <select id="filterKeyword" class="filter-select">
                            <option value="">모든 키워드</option>
                        </select>
                    </div>
                </div>
                <div class="news-feed" id="newsFeed">
                    <div class="skeleton-news"></div>
                    <div class="skeleton-news"></div>
                    <div class="skeleton-news"></div>
                </div>
            </section>

            <!-- 3. 키워드 관리 영역 (숨김) -->
            <section class="section modal-overlay" id="keywordModal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>📋 키워드 커스터마이징</h2>
                        <button class="btn-close" id="closeModalBtn">✕</button>
                    </div>

                    <div class="keyword-section">
                        <h3>협력사</h3>
                        <div class="keyword-list" id="supplierKeywords"></div>
                        <input type="text" id="newSupplier" placeholder="새 협력사 추가" class="keyword-input">
                        <button class="btn-small" onclick="addKeyword('협력사')">추가</button>
                    </div>

                    <div class="keyword-section">
                        <h3>품목</h3>
                        <div class="keyword-list" id="categoryKeywords"></div>
                        <input type="text" id="newCategory" placeholder="새 품목 추가" class="keyword-input">
                        <button class="btn-small" onclick="addKeyword('품목')">추가</button>
                    </div>

                    <div class="keyword-section">
                        <h3>원료</h3>
                        <div class="keyword-list" id="rawMaterialKeywords"></div>
                        <input type="text" id="newRawMaterial" placeholder="새 원료 추가" class="keyword-input">
                        <button class="btn-small" onclick="addKeyword('원료')">추가</button>
                    </div>

                    <div class="keyword-section">
                        <h3>정책/물류</h3>
                        <div class="keyword-list" id="policyKeywords"></div>
                        <input type="text" id="newPolicy" placeholder="새 키워드 추가" class="keyword-input">
                        <button class="btn-small" onclick="addKeyword('정책')">추가</button>
                    </div>

                    <div class="modal-actions">
                        <button class="btn-primary" onclick="saveKeywords()">저장</button>
                        <button class="btn-secondary" onclick="resetToDefault()">기본값으로 복원</button>
                    </div>
                </div>
            </section>
        </main>

        <!-- 푸터 -->
        <footer class="footer">
            <p>데이터는 GitHub Actions를 통해 매일 자동 갱신됩니다. | <a href="#" onclick="showAbout()">정보</a></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
